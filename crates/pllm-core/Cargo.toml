[package]
name = "pllm-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Exact integer execution, codecs, and masking for private LLM inference"
publish = false

[features]
# Publicly known keys: deterministic fresh graphs for tests only. Never production.
insecure-test-support = []

[dependencies]
aes.workspace = true
rayon.workspace = true
getrandom.workspace = true
k256 = { version = "0.13.4", default-features = false, features = ["arithmetic", "std"] }
libm.workspace = true
serde.workspace = true
sha2.workspace = true
sha3.workspace = true
subtle.workspace = true
zeroize.workspace = true
tempfile.workspace = true
flate2.workspace = true

[dev-dependencies]
num-bigint = "0.4.6"
serde_json.workspace = true
