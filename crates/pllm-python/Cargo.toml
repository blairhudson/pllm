[package]
name = "pllm-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Python bindings for the PLLM native execution core"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pllm-core.workspace = true
pllm-compiler.workspace = true
pllm-types.workspace = true
pllm-bench.workspace = true
pllm-assurance.workspace = true
pllm-models.workspace = true
pyo3.workspace = true
serde_json.workspace = true
