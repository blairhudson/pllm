[package]
name = "pllm-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Deterministic plan compiler for private LLM inference"
publish = false

[dependencies]
pllm-core.workspace = true
pllm-garble.workspace = true
pllm-types.workspace = true
pllm-models.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
getrandom.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Resolver 2 excludes this feature from ordinary production dependency builds.
# Tests unify it with the normal pllm-core dependency in their dependency graph.
pllm-core = { workspace = true, features = ["insecure-test-support"] }
