[workspace]
members = ["crates/pllm-core", "crates/pllm-python"]
default-members = ["crates/pllm-core"]
resolver = "2"

[workspace.package]
version = "0.17.0-alpha.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Blair Hudson"]

[workspace.dependencies]
pllm-core = { path = "crates/pllm-core" }
pyo3 = { version = "=0.29.2", features = ["abi3-py311"] }
rayon = "=1.12.0"
getrandom = "=0.4.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
