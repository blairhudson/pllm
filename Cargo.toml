[workspace]
members = [
    "crates/pllm-core",
    "crates/pllm-types",
    "crates/pllm-compiler",
    "crates/pllm-bench",
    "crates/pllm-assurance",
    "crates/pllm-garble",
    "crates/pllm-models",
    "crates/pllm-plugin-api",
    "crates/pllm-python",
]
default-members = [
    "crates/pllm-core",
    "crates/pllm-types",
    "crates/pllm-compiler",
    "crates/pllm-bench",
    "crates/pllm-assurance",
    "crates/pllm-garble",
    "crates/pllm-models",
    "crates/pllm-plugin-api",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Blair Hudson"]

[workspace.dependencies]
aes = { version = "0.9.3", features = ["zeroize"] }
pllm-core = { path = "crates/pllm-core" }
pllm-compiler = { path = "crates/pllm-compiler" }
pllm-types = { path = "crates/pllm-types" }
pllm-bench = { path = "crates/pllm-bench" }
pllm-assurance = { path = "crates/pllm-assurance" }
pllm-garble = { path = "crates/pllm-garble" }
pllm-models = { path = "crates/pllm-models" }
pllm-plugin-api = { path = "crates/pllm-plugin-api" }
pyo3 = { version = "=0.29.2", features = ["abi3-py311"] }
rayon = "=1.12.0"
getrandom = "=0.4.3"
libm = "=0.2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
subtle = "2.6"
tempfile = "3.22"
zeroize = "1.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
