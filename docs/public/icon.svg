<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120">
  <defs>
    <mask id="left-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="180" height="120">
      <rect width="180" height="120" fill="white"/>
      <circle cx="120" cy="60" r="60" fill="black"/>
    </mask>

    <mask id="right-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="180" height="120">
      <rect width="180" height="120" fill="white"/>
      <circle cx="60" cy="60" r="60" fill="black"/>
    </mask>
  </defs>

  <circle cx="60" cy="60" r="60" fill="#F4F6F1" mask="url(#left-cut)"/>
  <circle cx="120" cy="60" r="60" fill="#B8FF7A" mask="url(#right-cut)"/>
</svg>
