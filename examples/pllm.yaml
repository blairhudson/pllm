schema: pllm.experiment.v1
name: qwen-local
pipeline:
  profile: baseline.masked_linear_cpu
  model:
    source: Qwen/Qwen2.5-0.5B-Instruct
  components:
    linear:
      component: pllm/masked-linear
      params: {}
    preparation:
      component: pllm/model-aware-corrections
      params: {}
    inference:
      component: pllm/inference
      params: {}
    kernels:
      component: pllm/cpu
      params:
        threads: 4
deployment:
  kind: local
  root: .pllm/qwen-local
budget:
  requests: 1
  max_input_tokens: 128
  max_new_tokens: 32
