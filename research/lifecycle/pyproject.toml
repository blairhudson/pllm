[project]
name = "pllm-lifecycle-study"
version = "0.14.0+inference.study1"
description = "Reproducible PLLM inference lifecycle experiments"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.3.5",
  "torch==2.10.0",
  "tenseal==0.3.17",
  "safetensors>=0.4",
  "msgpack>=1.0",
]

[dependency-groups]
test = ["pytest>=8"]


[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
