name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.event_name == 'push' && 'non-production' || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event_name == 'push' && 'non-production' || 'production' }}
      url: ${{ github.event_name == 'push' && 'https://non.pllm.run' || 'https://pllm.run' }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PAGES_PROJECT: ${{ github.event_name == 'push' && 'pllm-non' || 'pllm-production' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - id: site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pllm-site
          path: docs/out/
          if-no-files-found: error
      - name: Require main for production
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deployments must be dispatched from main." >&2
            exit 1
          fi
      - name: Deploy with Restack
        uses: blairhudson/restack/actions/run@0434ee8d3cb2c416188cae8d68eb2b246fc2ac1f
        with:
          args: |
            ci
            cloudflare
            pages
            deploy
            --directory
            docs/out
            --project-name
            ${{ env.PAGES_PROJECT }}
            --branch
            main
            --environment
            production
            --release
            ${{ github.sha }}
            --artifact-sha256
            ${{ steps.site.outputs.artifact-digest }}
            --wrangler-version
            4.126.0
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ github.event_name == 'push' && secrets.PLLM_NON_PAGES_API_TOKEN || secrets.PLLM_PRODUCTION_PAGES_API_TOKEN }}
