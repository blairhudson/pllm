name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.event_name == 'push' && 'non-production' || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event_name == 'push' && 'non-production' || 'production' }}
      url: ${{ github.event_name == 'push' && 'https://non.pllm.run' || 'https://pllm.run' }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PAGES_PROJECT: ${{ github.event_name == 'push' && 'pllm-non' || 'pllm-production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - id: site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pllm-site
          path: docs/out/
          if-no-files-found: error
      - name: Require main for production
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deployments must be dispatched from main." >&2
            exit 1
          fi
      - name: Deploy with Restack
        uses: blairhudson/restack-action@27f15855d76ba9137f33de29eb9a51f9b2be9340
        with:
          args: |
            ci
            cloudflare
            pages
            deploy
            --directory
            docs/out
            --project-name
            ${{ env.PAGES_PROJECT }}
            --branch
            main
            --environment
            production
            --release
            ${{ github.sha }}
            --artifact-sha256
            ${{ steps.site.outputs.artifact-digest }}
            --wrangler-version
            4.126.0
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ github.event_name == 'push' && secrets.PLLM_NON_PAGES_API_TOKEN || secrets.PLLM_PRODUCTION_PAGES_API_TOKEN }}
