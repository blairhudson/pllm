name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - paper/**
      - research/evidence/**
      - scripts/prepare_docs.py
      - scripts/build_paper.py
      - .github/workflows/pages.yml
      - .github/workflows/docs-build.yml
      - Makefile
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  settings:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      base-path: ${{ steps.pages.outputs.base_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

  build:
    needs: settings
    uses: ./.github/workflows/docs-build.yml
    with:
      base-path: ${{ needs.settings.outputs.base-path }}

  deploy:
    needs: [settings, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pllm-site
          path: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
