name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.0"
  UV_LINK_MODE: copy
  PLLM_REQUIRE_RUST: "1"
  PLLM_KERNEL_BACKEND: rust
  CARGO_TERM_COLOR: always
  PLLM_HE_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: bash scripts/sync_environment.sh --python '${{ matrix.python }}'
      - run: uv run --no-sync pytest -m 'not he and not sdk and not quality'

  native:
    name: Native, integrations, and distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: bash scripts/sync_environment.sh --python 3.13 --extra he --extra sdk --extra quality
      - run: uv run --no-sync ruff check python/pllm scripts docs/scripts docs/tests tests
      - run: uv run --no-sync python scripts/benchmark_coverage.py --check --output target/sdk-benchmark-coverage.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sdk-benchmark-coverage
          path: target/sdk-benchmark-coverage.json
          if-no-files-found: error
      - run: |
          version="$(uv run --no-sync python -c 'import pllm; print(pllm.__version__)')"
          uv run --no-sync python scripts/release.py check "v$version"
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: PYO3_PYTHON="$(uv python find 3.13)" cargo clippy --locked --workspace --all-targets -- -D clippy::correctness
      - run: uv run --no-sync pytest -m 'he or sdk or quality'
      - run: uv build
      - run: uv run --no-sync python scripts/check_distributions.py dist
      - run: uv run --no-sync twine check --strict dist/*

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_BASE_PATH: /pllm
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: bash scripts/sync_environment.sh --python 3.13
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - uses: ./.github/actions/setup-paper-tools
      - run: uv run --no-sync python scripts/docs_regen.py --check
      - run: npm run build
        working-directory: docs
      - run: npm run typecheck
        working-directory: docs
