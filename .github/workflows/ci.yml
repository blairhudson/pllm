name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.0"
  UV_LINK_MODE: copy
  PLLM_REQUIRE_RUST: "1"
  PLLM_KERNEL_BACKEND: rust
  CARGO_TERM_COLOR: always
  PLLM_HE_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: bash scripts/sync_environment.sh --python '${{ matrix.python }}'
      - run: uv run --no-sync pytest -m 'not he and not sdk'

  native:
    name: Native, integrations, and distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: bash scripts/sync_environment.sh --python 3.13 --extra he --extra sdk
      - run: uv run --no-sync ruff check python/pllm scripts tests
      - run: |
          version="$(uv run --no-sync python -c 'import pllm; print(pllm.__version__)')"
          uv run --no-sync python scripts/release.py check "v$version"
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: PYO3_PYTHON="$(uv python find 3.13)" cargo clippy --locked --workspace --all-targets -- -D clippy::correctness
      - run: uv run --no-sync pytest -m 'he or sdk'
      - run: uv build
      - run: uv run --no-sync python scripts/check_distributions.py dist
      - run: uv run --no-sync twine check --strict dist/*

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_BASE_PATH: /pllm
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: bash scripts/sync_environment.sh --python 3.13
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: uv run --no-sync python scripts/docs_regen.py --check
      - run: npm run build
        working-directory: docs
      - run: npm run typecheck
        working-directory: docs
