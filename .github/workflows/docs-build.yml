name: Build documentation

on:
  workflow_call:
    inputs:
      base-path:
        type: string
        default: ""
        description: "Static website path; /pllm exercises project Pages links"
      commit-sha:
        type: string
        required: true
        description: "Exact commit to build"
    outputs:
      artifact-digest:
        description: SHA-256 digest of the immutable site artifact
        value: ${{ jobs.build.outputs.artifact-digest }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      artifact-digest: ${{ steps.site.outputs.artifact-digest }}
    env:
      NEXT_PUBLIC_BASE_PATH: ${{ inputs.base-path }}
      NEXT_TELEMETRY_DISABLED: "1"
      UV_VERSION: "0.10.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit-sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: docs/.nvmrc
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install manuscript tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lmodern texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-plain-generic pandoc poppler-utils
      - name: Build the papers from source
        run: |
          make paper
          make whitepaper
          uv run --no-project --python 3.13 python scripts/prepare_docs.py
      - name: Verify downloadable paper source
        run: |
          source_dir="$(mktemp -d)"
          unzip -q docs/public/downloads/paper-source.zip -d "$source_dir"
          (cd "$source_dir" && python scripts/build_paper.py pdf)
      - name: Install website dependencies
        run: bash scripts/install_docs.sh
      - name: Validate and build Fumadocs
        working-directory: docs
        run: |
          npm run check:content
          npm test
          npm run typecheck
          npm run build
      - id: site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pllm-site
          path: docs/out/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pllm-paper
          path: |
            docs/public/downloads/paper.pdf
            docs/public/downloads/paper-source.zip
            docs/public/downloads/whitepaper.pdf
            docs/public/downloads/whitepaper.tex
          if-no-files-found: error
