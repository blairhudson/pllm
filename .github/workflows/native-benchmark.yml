name: Benchmark native migration
on:
  workflow_dispatch:
  pull_request:
    paths: ['crates/**', 'python/pllm/runtime/native.py', 'python/pllm/runtime/compact.py', 'benchmarks/**', 'python/pllm/runtime/quantization.py', 'python/pllm/runtime/stage_protocol.py', 'Cargo.toml', 'pyproject.toml']
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLLM_KERNEL_BACKEND: rust
      PLLM_REQUIRE_RUST: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.10.0"
      - run: bash scripts/sync_environment.sh --python 3.13
      - run: uv run --no-sync python benchmarks/rust_migration.py --cpp-reference --samples 15 --threads 1 --output results/one-thread.json --profile results/native.prof
      - run: uv run --no-sync python benchmarks/rust_migration.py --cpp-reference --samples 15 --threads 4 --output results/four-threads.json
      - run: uv run --no-sync python benchmarks/client_native.py --samples 30 --output results/client.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-benchmark
          path: results/
