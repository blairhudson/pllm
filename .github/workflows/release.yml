name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version and locks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Require matching version and committed locks
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release.py check "$RELEASE_TAG" --require-locks

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  pypi:
    name: Publish to PyPI
    needs: [validate, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/pllm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pllm-wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pllm-sdist
          path: dist
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.10.0"
      - name: Create distribution attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027
      - name: Publish verified distributions
        run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz

  github-release:
    name: Publish GitHub release assets
    needs: [verify, pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pllm-wheel-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pllm-sdist
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pllm-paper
          path: release-assets
      - name: Create complete repository source and checksums
        run: |
          python scripts/release.py archive --output release-assets
          python scripts/release.py checksums release-assets
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" =~ (a|b|rc)[0-9]+$ ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --title "PLLM ${RELEASE_TAG#v}" --generate-notes "${flags[@]}"
