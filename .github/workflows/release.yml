name: Release to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.10.0"
  MATURIN_VERSION: "1.15.0"

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.13
      - run: uv sync --locked --python 3.13
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - uses: ./.github/actions/setup-paper-tools
      - name: Validate tag and build sdist
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-sync python scripts/release.py check "$RELEASE_TAG" --require-locks --docs
          uvx --from "maturin==$MATURIN_VERSION" maturin sdist --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pllm-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Wheel ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            zig: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            zig: true
          - os: macos-14
            target: aarch64-apple-darwin
            zig: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            zig: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            zig: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PLLM_REQUIRE_RUST: "1"
      PLLM_KERNEL_BACKEND: rust
      TARGET: ${{ matrix.target }}
      USE_ZIG: ${{ matrix.zig }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.11
      - name: Build wheel
        run: |
          args=()
          if [[ "$USE_ZIG" == "true" ]]; then args+=(--zig --compatibility manylinux_2_28); fi
          uvx --from "maturin[zig]==$MATURIN_VERSION" maturin build \
            --release --locked --target "$TARGET" \
            --interpreter "$(uv python find 3.11)" --out dist "${args[@]}"
      - name: Test installed wheel
        run: |
          wheel="$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)"
          uv venv --python 3.11 "$RUNNER_TEMP/pllm-wheel"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python="$RUNNER_TEMP/pllm-wheel/Scripts/python.exe"
          else
            python="$RUNNER_TEMP/pllm-wheel/bin/python"
          fi
          uv pip install --python "$python" "$wheel"
          cd "$RUNNER_TEMP"
          "$python" "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pllm-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  pypi:
    name: Publish
    needs: [sdist, wheels]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pllm.run
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: pllm-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uvx --from 'twine==6.2.0' twine check --strict dist/*
      - run: uv publish --trusted-publishing always dist/*
