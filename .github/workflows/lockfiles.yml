name: Resolve dependency locks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.10.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: docs/.nvmrc
      - run: python scripts/lock_dependencies.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-locks
          path: |
            Cargo.lock
            uv.lock
            docs/package-lock.json
          if-no-files-found: error
      - name: Next action
        run: |
          echo 'Download dependency-locks and commit all three files through a normal PR.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow does not push to your repository or bypass branch protection.' >> "$GITHUB_STEP_SUMMARY"
