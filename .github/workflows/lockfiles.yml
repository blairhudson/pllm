name: Resolve dependency locks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.10.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: docs/.nvmrc
      - run: python scripts/lock_dependencies.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-locks
          path: |
            Cargo.lock
            uv.lock
            docs/package-lock.json
          if-no-files-found: error
      - name: Next action
        run: |
          echo 'Download dependency-locks and commit all three files through a normal PR.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow does not push to your repository or bypass branch protection.' >> "$GITHUB_STEP_SUMMARY"
