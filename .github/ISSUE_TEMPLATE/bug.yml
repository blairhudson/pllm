name: Bug report
description: Report a reproducible defect, without private prompts or credentials.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use private reporting as described in SECURITY.md.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal synthetic input and the exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit/version, OS, Python, UV, CPU/GPU, model format and privacy profile.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Sensitive data
      options:
        - label: I removed prompts, credentials, keys, masks and private checkpoint material.
          required: true
