name: native-and-contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm Rust toolchain
        run: rustc --version
      - name: Core test and clippy
        working-directory: native
        run: |
          cargo test --all-targets
          cargo clippy --all-targets
      - name: Build native Python wheel
        run: |
          python -m pip install maturin pytest jsonschema
          python -m pip install .
      - name: Installed native smoke
        run: |
          python -c "from pllm_uplift import native_benchmark; print(native_benchmark(dim=8, lanes=2, repeats=3))"
      - name: Package contracts
        run: python -m pytest -q tests
